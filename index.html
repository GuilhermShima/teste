<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Coluna Vertebral - AR</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      model-viewer {
        width: 100%;
        height: 100vh;
        background: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <model-viewer
      src="https://drive.google.com/uc?export=download&id=1GtLU9RJZ3e4JXFxEaxgkRrud7IvZUW7c"
      ios-src="https://drive.google.com/uc?export=download&id=1Rx3sPtrQC6kdNzCiXif-A0f7QUGG72N9"
      alt="Coluna Vertebral 3D"
      camera-controls
      auto-rotate
      ar
      ar-modes="scene-viewer quick-look webxr"
      loading="eager"
      exposure="1">
    </model-viewer>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  </body>
</html>
